<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 对话</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
    }

    .chat-card {
      width: 100%;
      max-width: 720px;
      height: 85vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid #eef0f4;
      font-weight: 600;
      font-size: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .msg-row.from-user {
      justify-content: flex-start;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      user-select: none;
    }

    .avatar.ai   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .avatar.user { background: linear-gradient(135deg, #64748b, #94a3b8); }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .from-ai .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .from-user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    .chat-footer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #eef0f4;
      background: #fff;
    }

    #user-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #user-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    #send-btn {
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover:not(:disabled)  { background: #4338ca; }
    #send-btn:active:not(:disabled) { transform: scale(0.97); }
    #send-btn:disabled {
      background: #c7d2fe;
      cursor: not-allowed;
    }

    .error-tip {
      align-self: center;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
    }

    .chat-body::-webkit-scrollbar {
      width: 6px;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }
    .chat-body::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
    .chat-body::-webkit-scrollbar-track {
      background: transparent;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }
      .chat-card {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-card">

    <div class="chat-header">
      <span class="dot"></span>
      <span>AI 助手</span>
    </div>

    <div class="chat-body" id="chat-body">
      <div class="msg-row from-ai">
        <div class="avatar ai">AI</div>
        <div class="bubble">你好！有什么可以帮你的吗？</div>
      </div>
    </div>

    <div class="chat-footer">
      <textarea id="user-input"
                rows="1"
                maxlength="2000"
                placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send-btn">发送</button>
    </div>

  </div>

  <script>
    const chatBody = document.getElementById('chat-body');
    const inputEl  = document.getElementById('user-input');
    const sendBtn  = document.getElementById('send-btn');

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (role === 'user' ? 'from-user' : 'from-ai');

      const avatar = document.createElement('div');
      avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
      avatar.textContent = role === 'user' ? '我' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row from-ai';

      const avatar = document.createElement('div');
      avatar.className = 'avatar ai';
      avatar.textContent = 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble typing';
      bubble.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showError(message) {
      const tip = document.createElement('div');
      tip.className = 'error-tip';
      tip.textContent = message;
      chatBody.appendChild(tip);
      scrollToBottom();
      setTimeout(() => tip.remove(), 3000);
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';

      sendBtn.disabled = true;
      inputEl.disabled = true;

      appendMessage('user', text);
      const typingRow = showTyping();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });

        const data = await res.json();
        typingRow.remove();

        if (res.ok && data.reply) {
          appendMessage('ai', data.reply);
        } else {
          showError(data.error || '请求失败，请稍后重试');
        }
      } catch (err) {
        typingRow.remove();
        showError('网络错误：' + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    inputEl.focus();
  </script>
</body>
</html>
