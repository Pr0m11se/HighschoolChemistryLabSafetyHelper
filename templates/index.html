<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中化学实验室安全助手</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
    }

    .chat-card {
      width: 100%;
      max-width: 760px;
      height: 94vh;
      max-height: 1000px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #eef0f4;
      font-weight: 600;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .header-title span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
    .dot.ok { background: #22c55e; }

    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .hdr-btn {
      background: transparent;
      border: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .hdr-btn:hover:not(:disabled) { border-color: #c7d2fe; color: #4f46e5; background: #eef2ff; }
    #clear-btn:hover:not(:disabled) { border-color: #fca5a5; color: #dc2626; background: #fef2f2; }
    .hdr-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.from-user { justify-content: flex-end; }
    .msg-row.from-user .avatar { order: 1; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff; user-select: none;
    }
    .avatar.ai   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .avatar.user { background: linear-gradient(135deg, #64748b, #94a3b8); }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .from-ai .bubble { background: #f3f4f6; color: #111827; border-bottom-left-radius: 4px; }
    .from-user .bubble { background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }

    .typing { display: flex; gap: 4px; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: #9ca3af;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40%           { opacity: 1;   transform: translateY(-3px); }
    }

    .chat-footer {
      display: flex; gap: 10px; padding: 14px 16px;
      border-top: 1px solid #eef0f4; flex-shrink: 0;
    }

    #user-input {
      flex: 1; min-height: 44px; max-height: 120px;
      padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 12px;
      font-size: 14px; line-height: 1.5; font-family: inherit;
      resize: none; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #user-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

    #send-btn {
      padding: 0 20px; border: none; border-radius: 12px;
      background: #4f46e5; color: #fff; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:hover:not(:disabled)  { background: #4338ca; }
    #send-btn:active:not(:disabled) { transform: scale(0.97); }
    #send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

    .error-tip {
      align-self: center;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      max-width: 90%;
      text-align: center;
    }

    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .chat-body::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* 设置密钥弹窗 */
    .mask {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .mask.show { display: flex; }
    .dialog {
      width: min(420px, 92vw); background: #fff; border-radius: 14px;
      padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    .dialog h3 { font-size: 15px; margin-bottom: 6px; }
    .dialog p { font-size: 12px; color: #6b7280; line-height: 1.6; margin-bottom: 12px; }
    .dialog input {
      width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 10px;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .dialog input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dialog-actions button {
      padding: 8px 16px; border-radius: 10px; font-size: 13px; font-family: inherit; cursor: pointer;
    }
    .btn-ghost { background: #fff; border: 1px solid #e5e7eb; color: #6b7280; }
    .btn-main { background: #4f46e5; border: 1px solid #4f46e5; color: #fff; }
    .dialog-tip { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .dialog-tip.err { color: #dc2626; }
    .dialog-tip.ok  { color: #16a34a; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .chat-card { height: 100vh; max-height: none; border-radius: 0; }
      .bubble { max-width: 85%; }
      .header-title span:last-child { font-size: 14px; }
    }
  </style>
</head>

<body>

  <div class="chat-card">

    <div class="chat-header">
      <div class="header-title">
        <span class="dot" id="status-dot"></span>
        <span>高中化学实验室安全助手</span>
      </div>
      <div class="header-actions">
        <button id="key-btn" class="hdr-btn" title="设置 DeepSeek API Key">设置密钥</button>
        <button id="clear-btn" class="hdr-btn" title="清空所有历史对话">清空对话</button>
      </div>
    </div>

    <div class="chat-body" id="chat-body"></div>

    <div class="chat-footer">
      <textarea id="user-input"
                rows="1"
                maxlength="2000"
                placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send-btn">发送</button>
    </div>

  </div>

  <div class="mask" id="key-mask">
    <div class="dialog">
      <h3>设置 DeepSeek API Key</h3>
      <p>密钥保存在本程序目录的 .env 文件中，仅本机可用。可到 platform.deepseek.com 创建，形如 sk-xxxxxxxx。</p>
      <input id="key-input" type="password" placeholder="粘贴 sk- 开头的 API Key" />
      <div class="dialog-tip" id="key-tip"></div>
      <div class="dialog-actions">
        <button class="btn-ghost" id="key-cancel">取消</button>
        <button class="btn-main" id="key-save">保存</button>
      </div>
    </div>
  </div>

  <script>
    const chatBody  = document.getElementById('chat-body');
    const inputEl   = document.getElementById('user-input');
    const sendBtn   = document.getElementById('send-btn');
    const clearBtn  = document.getElementById('clear-btn');
    const keyBtn    = document.getElementById('key-btn');
    const statusDot = document.getElementById('status-dot');
    const keyMask   = document.getElementById('key-mask');
    const keyInput  = document.getElementById('key-input');
    const keyTip    = document.getElementById('key-tip');

    const GREETING = '你好，我是高中化学实验室安全助手。\n可以问我：某种试剂怎么存放、两类药品能不能混放、皮肤或眼睛沾到了怎么办。\n紧急情况请先冲洗并立刻找老师，不要只依赖我\n如果你是老人，就告诉我，我会用更简单更浅显易懂的方式给你讲';

    function scrollToBottom() {
      requestAnimationFrame(() => { chatBody.scrollTop = chatBody.scrollHeight; });
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (role === 'user' ? 'from-user' : 'from-ai');

      const avatar = document.createElement('div');
      avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
      avatar.textContent = role === 'user' ? '我' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function createAiBubble() {
      const row = document.createElement('div');
      row.className = 'msg-row from-ai';

      const avatar = document.createElement('div');
      avatar.className = 'avatar ai';
      avatar.textContent = 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row from-ai';

      const avatar = document.createElement('div');
      avatar.className = 'avatar ai';
      avatar.textContent = 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble typing';
      bubble.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
      return row;
    }

    let keyWarningTip = null;

    function showError(message, keep) {
      const tip = document.createElement('div');
      tip.className = 'error-tip';
      tip.textContent = message;
      chatBody.appendChild(tip);
      scrollToBottom();
      if (keep === true) return tip;
      setTimeout(() => tip.remove(), 4000);
      return tip;
    }

    function clearKeyWarning() {
      if (keyWarningTip) { keyWarningTip.remove(); keyWarningTip = null; }
    }

    async function loadHistory() {
      try {
        const res  = await fetch('/history');
        const data = await res.json();
        const messages = data.messages || [];

        if (messages.length === 0) { appendMessage('ai', GREETING); return; }

        messages.forEach(m => {
          if (m.role === 'assistant') appendMessage('ai', m.content);
          else if (m.role === 'user') appendMessage('user', m.content);
        });
      } catch (err) {
        showError('加载历史失败：' + err.message);
      }
    }

    async function checkHealth() {
      try {
        const res  = await fetch('/health');
        const data = await res.json();
        if (data.api_key_configured) {
          statusDot.classList.add('ok');
        } else {
          statusDot.classList.remove('ok');
          keyWarningTip = showError('尚未配置 DeepSeek API Key，请点击右上角「设置密钥」。', true);
        }
      } catch (_) { /* 忽略 */ }
    }

    function openKeyDialog() {
      keyTip.textContent = '';
      keyTip.className = 'dialog-tip';
      keyMask.classList.add('show');
      keyInput.value = '';
      setTimeout(() => keyInput.focus(), 50);
    }

    function closeKeyDialog() { keyMask.classList.remove('show'); }

    async function saveKey() {
      const key = keyInput.value.trim();
      if (!key) { keyTip.textContent = '请先粘贴 API Key'; keyTip.className = 'dialog-tip err'; return; }

      keyTip.textContent = '保存中…';
      keyTip.className = 'dialog-tip';
      try {
        const res = await fetch('/api/key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));

        keyTip.textContent = '已保存，可以开始提问了';
        keyTip.className = 'dialog-tip ok';
        statusDot.classList.add('ok');
        clearKeyWarning();
        setTimeout(closeKeyDialog, 900);
      } catch (err) {
        keyTip.textContent = '保存失败：' + err.message;
        keyTip.className = 'dialog-tip err';
      }
    }

    function parseSseChunk(raw) {
      const events = [];
      raw.split('\n').forEach(line => {
        if (!line.startsWith('data:')) return;
        const payload = line.slice(5).trim();
        if (!payload) return;
        try { events.push(JSON.parse(payload)); } catch (_) { /* 不完整，丢弃 */ }
      });
      return events;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      inputEl.disabled = true;

      appendMessage('user', text);
      const typingRow = showTyping();

      let bubble = null;
      let replyText = '';
      let finished = false;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'text/event-stream',
          },
          body: JSON.stringify({ message: text }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          typingRow.remove();
          showError(data.error || ('请求失败：HTTP ' + res.status), true);
          if (data.need_key) openKeyDialog();
          return;
        }

        if (!res.body) {
          typingRow.remove();
          showError('当前浏览器不支持流式响应，请用 Chrome 或 Edge 打开。');
          return;
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (!finished) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const raw = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);

            for (const evt of parseSseChunk(raw)) {
              if (evt.error) {
                typingRow.remove();
                if (bubble) bubble.textContent = replyText || '（无回复）';
                showError(evt.error, true);
                finished = true;
                break;
              }
              if (evt.warning) showError(evt.warning);
              if (evt.delta) {
                if (!bubble) {
                  typingRow.remove();
                  bubble = createAiBubble();
                  clearKeyWarning();
                }
                replyText += evt.delta;
                bubble.textContent = replyText;
                scrollToBottom();
              }
              if (evt.done) { finished = true; break; }
            }
            if (finished) break;
          }
        }

        typingRow.remove();
        if (!bubble && !finished) showError('未收到回复，请稍后重试。');
      } catch (err) {
        typingRow.remove();
        showError('网络错误：' + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    async function clearHistory() {
      if (!confirm('确定要清空所有对话历史吗？')) return;

      clearBtn.disabled = true;
      try {
        const res = await fetch('/clear', { method: 'POST' });
        if (!res.ok) throw new Error('服务端返回 ' + res.status);

        chatBody.innerHTML = '';
        appendMessage('ai', '对话已清空，我们可以重新开始。');
      } catch (err) {
        showError('清空失败：' + err.message);
      } finally {
        clearBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearHistory);
    keyBtn.addEventListener('click', openKeyDialog);
    document.getElementById('key-cancel').addEventListener('click', closeKeyDialog);
    document.getElementById('key-save').addEventListener('click', saveKey);
    keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });
    keyMask.addEventListener('click', e => { if (e.target === keyMask) closeKeyDialog(); });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    (async function init() {
      await Promise.all([loadHistory(), checkHealth()]);
      inputEl.focus();
    })();
  </script>
</body>
</html>
